<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Brick-Out | Classic Brick Breaker</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        canvas { display: block; touch-action: none; border-radius: 4px; }
        #frame { padding: 8px; border: 2px solid #4fd8ff; border-radius: 12px; background: #05080f;
                 box-shadow: 0 0 14px rgba(79,216,255,.55), 0 0 40px rgba(255,64,140,.25), inset 0 0 10px rgba(79,216,255,.25); }
        #bar { display: flex; align-items: center; gap: 10px; padding: 0 2px 8px; color: #cfefff;
               font: 600 13px/1 system-ui, Arial, sans-serif; }
        #track { flex: 1; height: 10px; border-radius: 6px; background: #142033; overflow: hidden; border: 1px solid #27405f; }
        #fill { height: 100%; width: 1%; background: linear-gradient(90deg, #4fd8ff, #ff408c); transition: width .4s; }
        #best { color: #ff8fbf; white-space: nowrap; }
    </style>
</head>

<body>

    <div id="frame">
        <div id="bar"><span id="lv">Level 1 / 98</span><div id="track"><div id="fill"></div></div><span id="best">Best 1</span></div>
        <canvas id="gameCanvas"></canvas>
    </div>
    <script src="js/game.js"></script>

<script src="js/levels.js"></script>

<script src="classes/Paddle.js"></script>
<script src="classes/FloatingText.js"></script>
<script src="classes/Ball.js"></script>
<script src="classes/Brick.js"></script>
<script src="classes/Particle.js"></script>
<script src="classes/PowerUp.js"></script>
<script src="classes/Laser.js"></script>
<script src="js/sounds.js"></script>
<script src="js/audio.js"></script>
<script src="js/highscores.js"></script>
<script src="js/effects.js"></script>
<script src="js/collisions.js"></script>
<script src="js/update.js"></script>
<script src="js/draw.js"></script>
<script src="js/input.js"></script>

<script src="js/main.js"></script>

<script>
// Progress frame: shows how far the player is and the best level ever reached
setInterval(function(){
    if (typeof game === "undefined" || !game.level || !levels) return;
    var total = levels.length - 1, cur = Math.min(game.level, total), best = 1;
    try { best = parseInt(localStorage.getItem("brickoutBestLevel")) || 1; if (cur > best){ best = cur; localStorage.setItem("brickoutBestLevel", best); } } catch(e) { best = Math.max(best, cur); }
    document.getElementById("lv").textContent = "Level " + cur + " / " + total;
    document.getElementById("best").textContent = "Best " + best;
    document.getElementById("fill").style.width = Math.max(1, cur / total * 100) + "%";
}, 200);
</script>

<!-- Credits: sound effects by Kenney (kenney.nl), CC0 -->
</body>

</html>
